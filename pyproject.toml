[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airspace-complexity"
version = "0.1.0"
description = "Raw-data-based multi-aircraft airspace complexity research pipeline"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0,<7.0",
    "pyarrow>=18.0,<24.0",
    "zipfile-deflate64>=0.2.0,<0.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "python-docx>=1.2,<2.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
